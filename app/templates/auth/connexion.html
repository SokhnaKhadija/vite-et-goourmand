{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}

{% block contenu %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow">
        <div class="card-body p-4">
          <h1 class="h3 fw-bold text-center mb-1">Connexion</h1>
          <p class="text-muted text-center small mb-4">Accédez à votre espace personnel</p>

          <form method="post" action="{{ url_for('auth.connexion') }}" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Adresse e-mail</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="votre@email.fr" required autocomplete="email"
                       aria-required="true">
              </div>
            </div>
            <div class="mb-3">
              <label for="mot_de_passe" class="form-label fw-semibold">Mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                <input type="password" class="form-control" id="mot_de_passe" name="mot_de_passe"
                       placeholder="Votre mot de passe" required autocomplete="current-password"
                       aria-required="true">
                <button class="btn btn-outline-secondary" type="button"
                        onclick="toggleMDP('mot_de_passe', this)"
                        aria-label="Afficher/masquer le mot de passe">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="mb-3 d-flex justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="se_souvenir" name="se_souvenir">
                <label class="form-check-label small" for="se_souvenir">Se souvenir de moi</label>
              </div>
              <a href="{{ url_for('auth.mot_de_passe_oublie') }}" class="small text-veg">
                Mot de passe oublié ?
              </a>
            </div>
            <button type="submit" class="btn btn-veg w-100 mb-3">
              <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Se connecter
            </button>
          </form>

          <hr>
          <p class="text-center text-muted small mb-0">
            Pas encore de compte ?
            <a href="{{ url_for('auth.inscription') }}" class="text-veg fw-semibold">Créer un compte</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
